name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --platforms=android,ios,web --project-name weather_flutter --org dev.taha .
          # flutter create adds a sample counter test that doesn't apply to this app
          rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Analyze
        run: |
          flutter analyze > analyze.log 2>&1 || {
            grep -E "error|warning|info" analyze.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log || {
            grep -E "Error|Expected|Actual|FAILED|\.dart:[0-9]+" test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - run: flutter build web --release
