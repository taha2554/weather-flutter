name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: flutter create --platforms=android,ios,web --project-name weather_flutter --org dev.taha .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
